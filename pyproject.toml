[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kimix"
version = "0.1.29"
description = "Kimi Agent Tools - Custom tool collection for Kimi Agent SDK"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=2.4.3",
    "playwright",
    "markdownify",
    "kimi-cli-x>=1.45.3",
    "fastapi>=0.133.1",
    "uvicorn>=0.41.0",
    "httpx>=0.28.1",
    "orjson>=3.11.9",
    "pydantic>=2.13.4",
    "opencc-python-reimplemented>=0.1.7",
    "regex>=2023.0.0",
    "msgspec>=0.19.0",
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "apsw>=3.45.0",
    "rich>=13.0.0",         # Robust ANSI stripping fallback if regex edge cases surface
]

[project.optional-dependencies]
# Office document processing
office = [
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
]

# Image processing & OCR
image_process = [
    "pillow>=12.2.0",
]

# PySide6 desktop client. Kept optional so SDK/CLI-only installs do not pull Qt.
gui = ["PySide6>=6.8"]

# All optional dependencies
all = [
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "pillow>=12.2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "inline-snapshot>=0.33.0",
    "ruff>=0.15.10",
    "mypy>=1.5.0",
    "PySide6>=6.8",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/kimix", "src/kimi_agent_sdk", "src/kimix_gui"]
sources = ["src"]
# Compiled Qt catalogs are gitignored build output (rebuild with
# scripts/gui/build_translations.py). Hatchling skips VCS-ignored files, so name them
# as artifacts to keep them in the wheel; without them tr() silently falls back to
# English at runtime.
artifacts = ["src/kimix_gui/translations/*.qm"]

# The pure-Python ``kimix_native`` shim (``bin/kimix_native``) is the single
# home of the pure-Python reference implementations that src/kimix re-exports
# (bash/pwsh scanners, comment parsers, …), so it is bundled into the wheel as
# the top-level ``kimix_native`` package.  The compiled extension stays
# optional (staged into ``bin/`` by install.py / tools/sync_native.py); when it
# is absent the shim simply falls back to its pure-Python ``_compat`` code.
[tool.hatch.build.targets.wheel.force-include]
"bin/kimix_native" = "kimix_native"

[tool.uv]
link-mode = "symlink"

[tool.uv.workspace]
members = [
    "kimi-cli",
    "kimi-cli/packages/kosong",
    "kimi-cli/packages/kaos",
]

[tool.uv.sources]
kimi-cli-x = { workspace = true }
kosong-x = { workspace = true }
pykaos = { workspace = true }

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# Qt virtual methods must retain the camelCase names defined by PySide6.
"src/kimix_gui/qt/**/*.py" = ["N802"]
# Existing domain exception name is part of the migrated GUI API.
"src/kimix_gui/kimi_workdir.py" = ["N818"]
# The GUI test environment must be configured before importing Qt.
"tests/gui/conftest.py" = ["E402"]

[project.scripts]
kimix = "kimix.cli:cli"
kimix-gui = "kimix_gui.__main__:main"

[tool.mypy]
# Strict mode switch
strict = true

# Or manually enable individual strict checks (when strict = false)
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# Disallow implicit optional (None must be explicitly declared)
no_implicit_optional = true

# Check untyped definitions
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true

# Check Any types
disallow_any_generics = true

# Other useful options
show_error_codes = true        # Show error codes for easy # type: ignore[xxx]
ignore_missing_imports = true  # Skip when third-party libraries lack type stubs
exclude = ["tests/", "scripts/"]

[tool.pytest.ini_options]
  asyncio_mode = "auto"
  testpaths = ["tests"]
  pythonpath = ["."]
  qt_api = "pyside6"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[dependency-groups]
dev = [
    "inline-snapshot>=0.33.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.0.0",
    "pytest-qt>=4.5",
    "PySide6>=6.8",
    "ruff>=0.15.10",
    "mypy>=1.5.0",
    "respx>=0.22.0",
    "xlwt>=1.3.0",
]
